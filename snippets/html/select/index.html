<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/png" sizes="16x16" href="../../../resources/assets/favicon.ico" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>HTML - Custom select</title>

        <link rel="stylesheet" media="all" charset="utf-8" href="../../../shared/frameworks/highlight.js@9.12.0/idea.css" />
        <link rel="stylesheet" href="../../../resources/theme.css" />
        <link rel="stylesheet" href="../../../resources/snippet.css" />
        <link rel="stylesheet" href="./index.css" />

        <script type="text/javascript" charset="UTF-8" src="../../../shared/frameworks/highlight.js@9.12.0/highlight.js"></script>
        <script type="text/javascript" charset="UTF-8" src="../../../shared/frameworks/reveal.js@3.6.0/plugins/highlight.js"></script>
        <script type="module" src="./app.js"></script>
        <script type="module" charset="UTF-8" src="../../../resources/init-service-worker.js"></script>
    </head>

    <body class="page">
        <header class="page__header">
            <span>HTML - Custom select</span>
        </header>
        <section class="page__content page__content--splitted">
            <select name="simple">
                <option value="value1">Value 1</option>
                <option value="value2">Value 2</option>
                <option value="value3">Value 3</option>
                <option value="value4">Value 4</option>
                <option value="value5">Value 5</option>
            </select>
            <br />
            <br />
            <hr />
            <br />
            <select name="customize" class="customize">
                <option value="value1">Value 1</option>
                <option value="value2">Value 2</option>
                <option value="value3">Value 3</option>
                <option value="value4">Value 4</option>
                <option value="value5">Value 5</option></select
            ><br />
            <br />
            <hr />
            <br />
            <select name="fancy" class="fancy">
                <button>
                    <selectedcontent></selectedcontent>
                </button>
                <option value="value1">Value 1</option>
                <option value="value2">Value 2</option>
                <option value="value3">Value 3</option>
                <option value="value4">Value 4</option>
                <option value="value5">Value 5</option>
            </select>
        </section>
        <footer class="page__footer">
            <ul>
                <li>
                    <a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/Customizable_select" target="_blank">MDM - Customizable select</a>
                </li>
                <li>
                    <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/selectedcontent" target="_blank">MDM - selectedcontent tag</a>
                </li>
            </ul>
        </footer>
    </body>
</html>
